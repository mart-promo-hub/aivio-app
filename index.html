<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aivio - AI Social Analyzer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a2e, #1a1a5e, #2d1b69);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 20px;
        }
        .container {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 50px;
            max-width: 600px;
            width: 100%;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }
        .logo { font-size: 64px; margin-bottom: 10px; }
        h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #FFD700, #FF6B6B);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        p { font-size: 16px; opacity: 0.8; margin-bottom: 30px; line-height: 1.8; }
        .btn-pi {
            background: linear-gradient(135deg, #FFD700, #F5A623);
            color: #1a1a5e;
            border: none;
            padding: 18px 40px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(255, 215, 0, 0.3);
        }
        .btn-pi:hover { transform: scale(1.05); }
        .btn-pi:disabled { opacity: 0.5; cursor: not-allowed; }
        #status {
            margin-top: 25px;
            padding: 15px;
            border-radius: 15px;
            background: rgba(255,255,255,0.05);
            font-size: 14px;
            display: none;
        }
        .features {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 20px 0;
            text-align: right;
        }
        .features span {
            background: rgba(255,255,255,0.05);
            padding: 8px 12px;
            border-radius: 10px;
            font-size: 13px;
        }
        @media (max-width: 500px) {
            .container { padding: 30px; }
            .logo { font-size: 48px; }
            h1 { font-size: 24px; }
            .features { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🧠</div>
        <h1>AIVIO</h1>
        <p>منصة تعمل بالذكاء الاصطناعي لتحليل حسابات التواصل الاجتماعي والمواقع، وإنشاء تقارير احترافية مع توصيات مخصصة.</p>
        <div class="features">
            <span>📊 تحليل متقدم</span>
            <span>🤖 ذكاء اصطناعي</span>
            <span>📈 تقارير احترافية</span>
            <span>💡 توصيات مخصصة</span>
        </div>
        <button class="btn-pi" id="loginBtn" onclick="loginWithPi()">🚀 تسجيل الدخول عبر Pi</button>
        <div id="status"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/pi-sdk@latest/dist/pi-sdk.min.js"></script>
    <script>
        const statusDiv = document.getElementById('status');
        const loginBtn = document.getElementById('loginBtn');

        function showStatus(msg, isSuccess = true) {
            statusDiv.style.display = 'block';
            statusDiv.textContent = msg;
            statusDiv.style.background = isSuccess ? 'rgba(46, 213, 115, 0.2)' : 'rgba(255, 71, 87, 0.2)';
            statusDiv.style.border = isSuccess ? '1px solid #2ed573' : '1px solid #ff4757';
        }

        async function loginWithPi() {
            loginBtn.disabled = true;
            loginBtn.textContent = '⏳ جاري الاتصال...';
            showStatus('جاري الاتصال بـ Pi Network...', true);

            try {
                // 1. تهيئة Pi SDK (ننتظر حتى يكتمل)
                await Pi.init({ version: '2.0' });
                
                // 2. استدعاء المصادقة وطلب النطاق (Scope)
                const authResult = await Pi.authenticate(['username']);
                
                // 3. نجاح الدخول
                showStatus(`✅ تم تسجيل الدخول بنجاح! مرحباً ${authResult.user?.username || ''}`, true);
                loginBtn.textContent = '✅ تم الدخول';
                console.log('Access Token:', authResult.accessToken);
                
                // 4. (للخطوة المتقدمة) إرسال التوكن للخادم الخلفي للتحقق
                // await sendTokenToBackend(authResult.accessToken);

            } catch (error) {
                // 5. فشل الدخول أو إلغاؤه من قبل المستخدم
                showStatus(`❌ فشل تسجيل الدخول: ${error.message || 'خطأ غير معروف'}`, false);
            } finally {
                loginBtn.textContent = '🚀 تسجيل الدخول عبر Pi';
                loginBtn.disabled = false;
            }
        }

        // تحميل تلقائي (اختياري - علق أو أزل التعليق حسب الرغبة)
        // window.onload = function() {
        //     loginWithPi();
        // };
    </script>
</body>
</html>
